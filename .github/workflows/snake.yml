name: Snake contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0e75b6&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0369a1
            dist/github-snake-dark.svg?palette=github-dark&color_background=#1a1b27&color_dot_border=#1a1b27&color_snake=#36bcf7&color_dots=#24283b,#1e3a5f,#1d4ed8,#3b82f6,#93c5fd

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
