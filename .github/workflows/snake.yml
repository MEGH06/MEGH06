name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00C6FF&color_dots=#161b22,#3b0a75,#5b21b6,#7c3aed,#a78bfa
            dist/snake-light.svg?color_snake=#4F46E5&color_dots=#ebedf0,#ddd6fe,#a78bfa,#7c3aed,#5b21b6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
