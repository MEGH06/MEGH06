<style>
@font-face { font-family: 'Brand'; src: url(data:font/woff2;base64,) format('woff2'); }
.name { font-family: 'Brand', 'Segoe UI', Arial, sans-serif; font-size: 104px; letter-spacing: -2px; fill: #fff; }
.tag { font-family: 'Brand', 'Segoe UI', Arial, sans-serif; font-size: 21px; letter-spacing: 3px; fill: #fff; opacity: .88; }
.in { animation: rise 1.2s ease-out both; }
.in2 { animation: rise 1.2s .35s ease-out both; }
