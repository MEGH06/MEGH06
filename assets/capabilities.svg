<text x="438" y="302" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">Web and mobile. Next.js, React, FastAPI,</text>
<text x="438" y="322" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">auth, databases, Docker, Terraform, deploys.</text>
