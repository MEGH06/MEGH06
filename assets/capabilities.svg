<text x="38" y="302" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">Fine-tuning (QLoRA, 4-bit, on-device),</text>
<text x="38" y="322" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">PINNs, explainable AI, federated learning.</text>
