<text x="438" y="88" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#ededed">Computer Vision</text>
<text x="438" y="118" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">Segmentation (Mask2Former, Swin), detection,</text>
