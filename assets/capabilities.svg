<svg xmlns="http://www.w3.org/2000/svg" width="1214" height="382" viewBox="0 0 1214 382" role="img" aria-label="What I do: Robotics &amp; SLAM, Computer Vision, AI Engineering, AI Research, Full Stack &amp; Apps, Startup Mode">
