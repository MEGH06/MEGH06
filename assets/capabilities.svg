<text x="838" y="118" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">Agents, multi-agent swarms, RAG, eval gates,</text>
<text x="838" y="138" font-family="ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a8a">LLM apps that survive production traffic.</text>
