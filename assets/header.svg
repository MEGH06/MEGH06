<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Megh Dave - AI/ML and Full Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="1" stop-color="#0b0b2a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f1f55" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 900 96px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 12px; }
    .sub  { font: 600 22px 'Consolas', 'SFMono-Regular', Menlo, monospace; letter-spacing: 6px; fill: #9aa4ff; }
    .grid { animation: scroll 6s linear infinite; }
    .g1 { fill: #00f0ff; opacity: .75; animation: glitch1 2.8s steps(1) infinite; }
    .g2 { fill: #ff2bd6; opacity: .75; animation: glitch2 2.8s steps(1) infinite; }
    .scan { animation: scan 3.5s linear infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    .node:nth-of-type(2) { animation-delay: .4s; } .node:nth-of-type(3) { animation-delay: .8s; }
    .node:nth-of-type(4) { animation-delay: 1.2s; } .node:nth-of-type(5) { animation-delay: 1.6s; }
    @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(40px); } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes glitch1 { 0% { transform: translate(0,0); } 88% { transform: translate(-6px,2px); } 91% { transform: translate(5px,-3px); } 94% { transform: translate(0,0); } }
    @keyframes glitch2 { 0% { transform: translate(0,0); } 88% { transform: translate(6px,-2px); } 91% { transform: translate(-5px,3px); } 94% { transform: translate(0,0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <g class="grid"><rect y="-40" width="1200" height="340" fill="url(#grid)"/></g>
    <!-- neural-net motif on the right -->
    <g stroke="#2b2b7a" stroke-width="1.5" opacity=".9">
      <path d="M980 70L1060 50M980 70L1060 130M980 70L1060 210M980 190L1060 50M980 190L1060 130M980 190L1060 210M1060 50L1140 100M1060 130L1140 100M1060 210L1140 100M1060 50L1140 170M1060 130L1140 170M1060 210L1140 170"/>
    </g>
    <g fill="#00f0ff">
      <circle class="node" cx="980" cy="70" r="7"/><circle class="node" cx="980" cy="190" r="7"/>
      <circle class="node" cx="1060" cy="50" r="7"/><circle class="node" cx="1060" cy="130" r="7"/>
      <circle class="node" cx="1060" cy="210" r="7"/>
    </g>
    <g fill="#ff2bd6"><circle cx="1140" cy="100" r="7"/><circle cx="1140" cy="170" r="7"/></g>
    <!-- glitch name -->
    <text class="name g1" x="70" y="150">MEGH DAVE</text>
    <text class="name g2" x="70" y="150">MEGH DAVE</text>
    <text class="name" x="70" y="150" fill="url(#ink)">MEGH DAVE</text>
    <text class="sub" x="76" y="200">AI·ML  ·  SLAM  ·  AGENTS  ·  FULL STACK<tspan class="blink" fill="#00f0ff"> _</tspan></text>
    <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00f0ff" opacity=".18"/>
  </g>
</svg>
